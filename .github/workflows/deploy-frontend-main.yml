# Deploy React web frontend to Vercel when code is pushed to main.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN                 - Vercel API token (Account → Settings → Tokens)
#   VERCEL_ORG_ID                - Team/org ID (e.g. from frontend/.vercel/project.json orgId)
#   VERCEL_PROJECT_ID            - Frontend project ID (VERCEL_FRONTEND_PROJECT_ID in deploy-vercel.yml)

name: Deploy Frontend (main)

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Build and deploy React web to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React web app
        working-directory: frontend
        run: npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel env
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Prepare Vercel output (static)
        working-directory: frontend
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/* .vercel/output/static/
          echo '{"version":3,"routes":[{"handle":"filesystem"},{"src":"/(.*)","dest":"/index.html"}]}' > .vercel/output/config.json

      - name: Deploy to Vercel (production)
        working-directory: frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
